spring:
  config:
    import: optional:file:.env[.properties],optional:file:.env.prod[.properties]
  application:
    name: api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        options: "-c TimeZone=UTC"

  flyway:
    enabled: ${FLYWAY_ENABLED:false} # dev: tắt vì đang dùng Hibernate ddl-auto. Bật lại khi sang Sprint hardening
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:create-drop} # dev: wipe & recreate theo entity mỗi lần start. Override khi cần.
    defer-datasource-initialization: true # đảm bảo data.sql/schema.sql ở classpath chạy SAU khi Hibernate dựng xong schema
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always} # luôn chạy schema.sql + data.sql trong classpath sau khi Hibernate khởi tạo
      encoding: UTF-8

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: ${APP_PORT:8080}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%t] [%X{requestId:-}] %logger{40} - %m%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%t] [%X{requestId:-}] %logger{40} - %m%n"

app:
  urls:
    frontend-base: ${APP_FRONTEND_BASE_URL}
    api-public-base: ${APP_PUBLIC_API_BASE_URL}
    cors-allowed-origins:
      - "http://localhost:8081"
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
      - "http://localhost:3001"
      - "http://127.0.0.1:3001"
      - "http://localhost:5174"
      - "http://localhost:8081"
      - "http://localhost:8082"
      - "https://1g3l4zm9-9992.asse.devtunnels.ms"
      - "${APP_FRONTEND_BASE_URL}"
  logging:
    service-method-timing: false
  auth:
    email-verification-path: ${APP_AUTH_EMAIL_VERIFICATION_PATH:/verify-email}
    password-reset-path: ${APP_AUTH_PASSWORD_RESET_PATH:/reset-password}
    email-verification-page-url: ${APP_EMAIL_VERIFICATION_PAGE_URL:${app.urls.frontend-base}${app.auth.email-verification-path}}
    password-reset-page-url: ${APP_PASSWORD_RESET_PAGE_URL:${app.urls.frontend-base}${app.auth.password-reset-path}}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS}      # 15 minutes
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS}
  mail:
    from: ${MAIL_FROM}
    brand-name: ${APP_MAIL_BRAND_NAME:UniShare}
    otp-valid-minutes: ${APP_MAIL_OTP_VALID_MINUTES:10}

cloudinary:
  cloud-name: ${CLOUDINARY_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

vnpay:
  tmn-code: ${VNP_TMN_CODE}
  hash-secret: ${VNP_HASH_SECRET}
  url: ${VNP_URL}
  # true: bỏ qua cổng VNPay, tự ghi nhận thanh toán thành công khi checkout (dev). Prod: VNP_MOCK_ENABLED=false
  mock-enabled: ${VNP_MOCK_ENABLED:true}
  # Mặc định: callback BE sau thanh toán — nối từ app.urls.api-public-base (chỉnh một chỗ). Ghi đè: VNP_RETURN_URL
  return-url: ${VNP_RETURN_URL:${app.urls.api-public-base}/api/v1/payments/vnpay/return}
  frontend-return-url: ${VNP_FRONTEND_RETURN_URL:${app.urls.frontend-base}/payment-result}

# OpenAPI / Swagger UI — tắt trên prod: springdoc.swagger-ui.enabled=false và springdoc.api-docs.enabled=false
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
  packages-to-scan: com.unishare.api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
